project:
  type: website
  output-dir: docs
  # Reveal each meeting week by week: comment OUT its "!..." line below
  # (so it renders) once it's taught, then uncomment the matching entry
  # in website.sidebar.contents further down. Doing only one of the two
  # either publishes an unlisted page (still reachable by a direct URL)
  # or links to a page that doesn't exist yet.
  #
  # Lectures: Oct 3 (2x45) and Oct 24 (4x45), 2026.
  # The second meeting will use the existing lecture modules 2 and 3.
  # Labs: Nov 8 and Dec 13 (4x45 each), 2026.
  # Module 3 lab material is supplementary, not a scheduled third meeting.
  render:
    - "*.qmd"
    - "lectures/*.qmd"
    - "cwiczenia/*.qmd"
    - "!lectures/spotkanie2.qmd"
    - "!lectures/spotkanie3.qmd"
    - "!cwiczenia/spotkanie2.qmd"
    - "!cwiczenia/spotkanie3.qmd"

website:
  title: Projektowanie Aplikacji Sieciowych
  description: "Projektowanie Aplikacji Sieciowych dla studentów WAT w Warszawie"
  site-url: https://sebkaz-teaching.github.io/pas2026
  sidebar:
    style: "docked"
    contents:
      - index.qmd
      - section: "Wykłady"
        contents:
          - lectures/spotkanie1.qmd
          # - lectures/spotkanie2.qmd
          # - lectures/spotkanie3.qmd
      - section: "Laboratoria"
        contents:
          - cwiczenia/spotkanie1.qmd
          # - cwiczenia/spotkanie2.qmd
          # - cwiczenia/spotkanie3.qmd
  page-footer: "Copyright 2026, Sebastian Zając"
format:
  html:
    page-layout: article
    css: style.css
    theme: cosmo
    toc: true
    toc-depth: 2
    toc-title: "**Sections**"
    self-contained-math: true
    code-overflow: wrap
    highlight-style: dark
    code-block-background: true
    link-external-newwindow: true
